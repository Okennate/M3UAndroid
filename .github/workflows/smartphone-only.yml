name: Smartphone APK Only

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smartphone-only-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: zulu

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Restore signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 secret not set - APK will get a new signature every build"
          fi
      - name: Apply record patch
        run: git apply --verbose record.patch
        
      - name: Apply font patch
        run: git apply --verbose system-font.patch
        
      - name: Apply onscreen patch
        run: git apply --verbose keep-screen-on.patch

      - name: Apply favorite patch
        run: git apply --verbose continue-watching-to-favourites.patch
        
      - name: Apply reconnect patch
        run: git apply --verbose reconnect.patch
        
      - name: Apply quality patch
        run: git apply --verbose video-quality-and-network-tuning.patch

      - name: Build smartphone release APK
        run: ./gradlew :app:smartphone:assembleRelease

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: smartphone-apk
          if-no-files-found: error
          retention-days: 30
          path: app/smartphone/build/outputs/published-apk/release/*.apk
